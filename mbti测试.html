function getDeepQsByDim(dims) {
  const result = [];
  const seen = new Set();
  dims.forEach(dimPair => {
    const [d1, d2] = dimPair.split("");
    const pool = RAW_93.filter(q => q.dimA === d1 || q.dimA === d2);
    const shuffled = [...pool].sort(() => Math.random() - 0.5).slice(0, 10);
    shuffled.forEach(q => { if (!seen.has(q.id)) { seen.add(q.id); result.push(q); } });
  });
  return result;
}

// ── DeepSeek API ──────────────────────────────────────
const LS_KEY = "career_planner_api_key";
function getStoredKey() { try { return localStorage.getItem(LS_KEY) || ""; } catch { return ""; } }
function storeKey(k)    { try { localStorage.setItem(LS_KEY, k); } catch {} }

async function callAI(apiKey, system, user) {
  const res = await fetch("https://api.deepseek.com/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${apiKey}`,
    },
    body: JSON.stringify({
      model: "deepseek-chat",
      messages: [
        { role: "system", content: system },
        { role: "user",   content: user },
      ],
      max_tokens: 1000,
    }),
  });
  const d = await res.json();
  if (d.error) throw new Error(d.error.message);
  return d.choices?.[0]?.message?.content || "";
}

function calcType(raw) {
  return `${(raw.E||0)>=(raw.I||0)?"E":"I"}${(raw.S||0)>=(raw.N||0)?"S":"N"}${(raw.T||0)>=(raw.F||0)?"T":"F"}${(raw.J||0)>=(raw.P||0)?"J":"P"}`;
}

function MBTITest({ onDone }) {
  const [idx, setIdx] = useState(0);
  const [ans, setAns] = useState({});
  const q = MBTI_Q[idx];

  const pick = (choice) => {
    const next = { ...ans, [q.id]: choice };
    setAns(next);
    if (idx < MBTI_Q.length - 1) { setIdx(idx + 1); return; }

    const dims = { E:0, I:0, S:0, N:0, T:0, F:0, J:0, P:0 };
    MBTI_Q.forEach(q2 => {
      const a = q2.id === q.id ? choice : next[q2.id];
      if (!a || a === "mid") return;
      if (a === "a") dims[q2.dim] = (dims[q2.dim] || 0) + 1;
      else           dims[DIM_OPP[q2.dim]] = (dims[DIM_OPP[q2.dim]] || 0) + 1;
    });

    const uncertainDims = [["E","I"],["S","N"],["T","F"],["J","P"]]
      .filter(([a,b]) => Math.abs((dims[a]||0) - (dims[b]||0)) <= 1)
      .map(([a,b]) => `${a}${b}`);

    onDone({ type: calcType(dims), raw: dims, uncertainDims });
  };

  return (
    <div style={{ maxWidth: 520, margin: "0 auto", padding: "36px 20px" }}>
      <Tag bg={C.secondaryLight} color={C.secondary}>🧠 MBTI 人格测试</Tag>

        <OptBtn label="B" text={q.b} badgeBg={C.secondaryLight} badgeColor={C.secondary} onClick={() => pick("b")} />

  );

function HollandTest({ apiKey, onDone }) {
  const [ans, setAns]         = useState({});
  const [loading, setLoading] = useState(false);
  const [errMsg, setErrMsg]   = useState("");
  const done = Object.keys(ans).length;

  const submit = async () => {
    setLoading(true);
    try {
      const scores = { R:0, I:0, A:0, S:0, E:0, C:0 };
      HOLLAND_Q.forEach(q => { scores[q.type] += (ans[q.id]||0); });
      const sorted = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
      const top3 = sorted.slice(0,3).map(([k])=>k);
      const sys = `你是温和专业的大学生职业规划顾问，中文，亲切。 输出格式（纯文本，不要markdown标记）： 【你的职业兴趣组合】 【你的兴趣特点】2-3句 【推荐专业方向】3-4个，每个简短说明 【推荐职业举例】6-8个具体职业 【发展建议】1-2句鼓励`;
      const scoreDesc = sorted.map(([k,v])=>`${HL_LABEL[k]}(${k}):${v}分`).join("、");
      const analysis = await callAI(apiKey, sys, `霍兰德结果：${scoreDesc}，前三类型${top3.join("")}型。`);
      setLoading(false);
      onDone({ scores, top3, analysis });
    } catch(e) {
      setLoading(false);

  if (loading) return <Loading text="AI正在分析你的职业兴趣" />;

            <div style={{ display:"flex", justifyContent:"space-between", fontSize:12, marginBottom:5 }}>
              <span style={{ fontWeight:700, color:C.text }}>{HL_LABEL[k]}（{k}）</span>
              <span style={{ color:C.textSub }}>{v} / 20</span>
            </div>
            <div style={{ background:C.border, borderRadius:99, height:8 }}>
              <div style={{ width:`${(v/20)*100}%`, background:result.top3.includes(k)?C.accent:"#D9D3CD",
                borderRadius:99, height:"100%", transition:"width .6s ease" }} />
            </div>
          </div>
        ))}
      </div>
      <div style={{ ...cardStyle, padding:"22px", marginBottom:24, whiteSpace:"pre-wrap", fontSize:14, lineHeight:1.9, color:C.text }}>
        {result.analysis}
      </div>
      <Btn variant="ghost" full onClick={back}>← 返回首页</Btn>
    </div>
  );
}

function Summary({ results, apiKey, back }) {
  const [analysis, setAnalysis] = useState("");
  const [loading, setLoading]   = useState(true);
  const [errMsg, setErrMsg]     = useState("");

  useEffect(() => {
    (async () => {
      try {
        const sys = `你是专业的大学生职业规划顾问，结合MBTI和霍兰德结果给出综合个性化建议。中文，亲切有深度。 输出格式（纯文本）： 【综合分析】3-4句，融合两项测试核心发现 【你的独特优势】3个要点，每个一句 【最适合你的职业方向】top3，每个简短说明为何适合 【推荐的大学专业/学习侧重】具体建议 【给你的寄语】1-2句温暖的话`;
        const r = await callAI(apiKey, sys,
          `MBTI: ${results.mbti.type}，霍兰德: ${results.holland.top3.join("")}型（${results.holland.top3.map(k=>HL_LABEL[k]).join("、")}）。请综合分析。`
        );
        setAnalysis(r); setLoading(false);
      } catch(e) { setLoading(false); setErrMsg(e.message||"请求失败"); }
    })();
  }, []);

  if (loading) return <Loading text="AI正在生成专属职业规划" />;
  if (errMsg) return (
    <div style={{ maxWidth:520, margin:"0 auto", padding:36, textAlign:"center" }}>
      <div style={{ color:C.accent, fontSize:14, marginBottom:16 }}>⚠ {errMsg}</div>
      <Btn variant="ghost" onClick={back}>返回首页</Btn>
    </div>
  );

  return (
    <div style={{ maxWidth:520, margin:"0 auto", padding:"36px 20px" }}>
      <div style={{ textAlign:"center", marginBottom:28 }}>
        <div style={{ fontSize:48, marginBottom:10 }}>✨</div>
        <h2 style={{ fontSize:22, fontWeight:800, color:C.text }}>你的专属职业规划</h2>
        <div style={{ display:"flex", justifyContent:"center", gap:8, marginTop:10 }}>
          <Tag bg={C.secondaryLight} color={C.secondary}>{results.mbti.type}</Tag>
          <Tag bg={C.accentLight} color={C.accent}>{results.holland.top3.join("")}型</Tag>
        </div>
      </div>
      <div style={{ ...cardStyle, padding:"24px", marginBottom:24, whiteSpace:"pre-wrap", fontSize:14, lineHeight:1.95, color:C.text }}>
        {analysis}
      </div>
      <Btn variant="ghost" full onClick={back}>← 返回首页</Btn>
    </div>
  );
}

function App() {
  const [apiKey, setApiKey]       = useState(getStoredKey);
  const [showModal, setShowModal] = useState(!getStoredKey());
  const [page, setPage]           = useState("home");
  const [results, setResults]     = useState({ mbti: null, holland: null });
  const [mbtiBaseRaw, setMbtiBaseRaw]     = useState(null);
  const [mbtiUncertain, setMbtiUncertain] = useState([]);
  const [mbtiPending, setMbtiPending]     = useState(null);

  const go = p => setPage(p);

  const onMbtiDone = ({ type, raw, uncertainDims }) => {
    setMbtiBaseRaw(raw);
    setMbtiPending({ type, raw });
    if (uncertainDims && uncertainDims.length > 0) {
      setMbtiUncertain(uncertainDims); go("mbtiUncertain");
    } else {
      fetchMbtiAnalysis(type, raw);
    }
  };

  const fetchMbtiAnalysis = async (type, raw) => {
    go("loading");
    try {
      const sys = `你是温和专业的大学生职业规划顾问，用中文，亲切不正式。 输出格式（纯文本，不要markdown标记）： 【类型名称】（如：INTJ · 建筑师） 【性格特点】2-3句 【学习与工作风格】1-2句 【适合职业方向】3-4个方向，每个加一句说明 【给你的小建议】1-2句鼓励`;
      const analysis = await callAI(apiKey, sys, `我的MBTI是 ${type}，请分析。`);
      setResults(p => ({ ...p, mbti: { type, raw, analysis } }));
      go("mbtiResult");
    } catch(e) { go("home"); alert("API调用失败：" + (e.message||"请检查Key")); }
  };

  const onHollandDone = r => { setResults(p => ({ ...p, holland: r })); go("hollandResult"); };

  if (showModal) return <ApiKeyModal onSave={k => { setApiKey(k); setShowModal(false); }} />;

  return (
    <div style={{ minHeight:"100vh", background:C.bg }}>
      {page==="home"          && <Home go={go} results={results} onChangeKey={() => setShowModal(true)} />}
      {page==="mbti"          && <MBTITest onDone={onMbtiDone} />}
      {page==="mbtiUncertain" && <MBTIUncertain dims={mbtiUncertain}
        onDeep={() => go("mbtiDeep")}
        onSkip={() => fetchMbtiAnalysis(mbtiPending.type, mbtiPending.raw)} />}
      {page==="mbtiDeep"      && <MBTIDeep dims={mbtiUncertain} baseRaw={mbtiBaseRaw}
        onDone={({ type, raw }) => fetchMbtiAnalysis(type, raw)} />}
      {page==="mbtiResult"    && results.mbti    && <MBTIResult result={results.mbti} back={() => go("home")} />}
      {page==="holland"       && <HollandTest apiKey={apiKey} onDone={onHollandDone} />}
      {page==="hollandResult" && results.holland && <HollandResult result={results.holland} back={() => go("home")} />}
      {page==="summary"       && results.mbti && results.holland &&
        <Summary results={results} apiKey={apiKey} back={() => go("home")} />}
      {page==="loading"       && <Loading text="AI正在分析" />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
